[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lending-reliability-lab"
version = "0.1.0"
description = "Synthetic lending workflow reliability demonstration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1", "hypothesis>=6.115,<7"]
gemini = ["google-genai>=3.0,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["lending_lab*"]
