name: public-verity-guest-browser
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  public-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise live deployed no-login guest workspace over HTTPS
        env:
          E2E_BASE_URL: https://verity-api-staging.up.railway.app
        run: npm run test:e2e -- --grep "public reliability explainer"
        working-directory: frontend
