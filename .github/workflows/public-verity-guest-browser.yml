name: public-verity-guest-browser
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  public-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated no-login frontend preview
        run: (npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/verity-preview.log 2>&1 &)
        working-directory: frontend
      - name: Exercise proposed guest workspace without touching live deployment
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e -- --grep "public reliability explainer"
        working-directory: frontend
