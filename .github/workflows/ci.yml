name: backend-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lending_lab_test
          POSTGRES_USER: lending_migrator
          POSTGRES_PASSWORD: migrator-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lending_migrator -d lending_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_MODE: local_demo
      REQUIRE_POSTGRES_TESTS: "1"
      TEST_DATABASE_URL: postgresql://lending_runtime:runtime-test-password@localhost:5432/lending_lab_test
      TEST_MIGRATION_DATABASE_URL: postgresql://lending_migrator:migrator-test-password@localhost:5432/lending_lab_test
      TEST_LAB_DATABASE_URL: postgresql://lending_lab_operator:lab-test-password@localhost:5432/lending_lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python scripts/bootstrap_test_roles.py
      - run: pytest --junitxml=pytest-results.xml
      - run: python scripts/assert_ci_test_results.py pytest-results.xml
