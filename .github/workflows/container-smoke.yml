name: Container smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert local-only port bindings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          cfg = json.loads(subprocess.check_output(
              ["docker", "compose", "config", "--format", "json"], text=True
          ))
          for service_name in ("api", "db"):
              ports = cfg["services"][service_name].get("ports", [])
              assert ports, f"{service_name} should expose a local development port"
              for port in ports:
                  assert port.get("host_ip") == "127.0.0.1", (
                      f"{service_name} must not publish an Internet-facing port: {port}"
                  )
          print("Local-only API and database port binding verified")
          PY

      - name: Build images
        run: docker compose build --pull

      - name: Start synthetic local-demo stack
        run: docker compose up -d

      - name: Verify API, database, and web UI
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health | grep -q '"database":"connected"'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Health check did not pass"
            exit 1
          fi
          curl -fsS --max-time 5 http://127.0.0.1:8000/ -o /tmp/verity-index.html
          grep -qi '<html' /tmp/verity-index.html
          echo "Container, database, and frontend smoke check passed"

      - name: Set up Node for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run four synthetic browser journeys
        run: npm run test:e2e -- --workers=1
        working-directory: frontend

      - name: Inspect container status
        if: always()
        run: docker compose ps -a

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 120

      - name: Clean up isolated CI data
        if: always()
        run: docker compose down -v --remove-orphans
